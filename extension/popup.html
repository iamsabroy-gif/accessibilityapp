<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Scanner</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;

    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
    }

    .settings-btn:hover {
      color: var(--text-primary);
    }

    .config-panel {
      display: none;
      margin-bottom: 16px;
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .config-panel.open {
      display: block;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .field-group label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .field-group input {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-panel {
      margin-top: 16px;
      display: none;
    }

    .status-panel.active {
      display: block;
    }

    .score-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
    }

    .score-value {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .score-grade {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .grade-A { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .grade-B { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
    .grade-C { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .grade-D, .grade-F { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 700;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .report-link {
      display: block;
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: rgba(99, 102, 241, 0.1);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .report-link:hover {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
    }

    .report-link.hidden {
      display: none;
    }
    .access-panel h2 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    .access-panel p {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0 0 10px;
    }
    .access-panel hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 12px 0;
    }
    .link-btn {
      background: none;
      border: none;
      color: #a5b4fc;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 0;
      margin-top: 8px;
    }
    .small-btn {
      padding: 6px 12px;
      font-size: 12px;
    }
    .access-status, .scans-left {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 8px 0 0;
    }
    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 12px;
    }
    .account-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .account-email {
      color: var(--text-primary);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-scans {
      color: var(--text-secondary);
    }
    .logout-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .logout-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }
    .inline-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">A</div>
      <span>Accessibility Scanner</span>
    </div>
    <button id="toggleConfig" type="button" class="settings-btn" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="configPanel">⚙️</button>
  </div>

  <div id="configPanel" class="config-panel">
    <div class="field-group">
      <label for="apiBaseInput">API Server URL</label>
      <input type="text" id="apiBaseInput" value="https://www.accessscan.in" placeholder="https://www.accessscan.in">
    </div>
    <button id="saveConfigBtn" type="button" class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;">Save Server URL</button>
  </div>

  <div id="accountBar" class="account-bar" hidden>
    <div class="account-info">
      <span id="accountEmail" class="account-email"></span>
      <span id="accountScansLeft" class="account-scans" role="status"></span>
    </div>
    <button id="logoutBtn" type="button" class="logout-btn">Log out</button>
  </div>

  <button id="scanBtn" type="button" class="btn btn-primary">
    <div id="btnSpinner" class="spinner"></div>
    <span id="btnText">Scan This Page</span>
  </button>

  <div id="errorBox" class="error-box" role="alert"></div>
  <p id="scansLeft" class="scans-left" role="status"></p>
  <button id="toggleLogin" type="button" class="link-btn" aria-expanded="false" aria-controls="loginPanel">Sign in with email</button>

  <div id="loginPanel" class="config-panel access-panel">
    <h2>Sign in</h2>
    <p id="loginSubtitle">Enter your email to receive a 6-digit login code.</p>
    <div id="loginError" class="error-box" role="alert"></div>
    <form id="loginEmailForm">
      <div class="field-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
      </div>
      <button type="submit" id="sendCodeBtn" class="btn btn-primary small-btn">Send code</button>
    </form>
    <form id="loginCodeForm" hidden>
      <div class="field-group">
        <label for="loginCode">6-digit code</label>
        <input type="text" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      </div>
      <button type="submit" id="verifyCodeBtn" class="btn btn-primary small-btn">Verify &amp; sign in</button>
      <div class="inline-actions">
        <button type="button" id="resendCodeBtn" class="link-btn" hidden>Resend code</button>
        <button type="button" id="changeEmailBtn" class="link-btn">Use a different email</button>
      </div>
    </form>
    <p id="loginStatus" class="access-status" role="status"></p>
  </div>

  <div id="requestPanel" class="config-panel access-panel" hidden>
    <h2>Request more scans</h2>
    <p>You have used all your available scans. Request more scans for your account.</p>
    <button type="button" id="requestScansBtn" class="btn btn-primary small-btn">Request more scans</button>
    <p id="requestScansStatus" class="access-status" role="status"></p>
  </div>

  <div id="statusPanel" class="status-panel">
    <div class="score-card">
      <div id="scoreValue" class="score-value">--</div>
      <div id="scoreGrade" class="score-grade">Grade --</div>
      <div id="compliancePct" style="font-size: 12px; color: var(--text-secondary);">--% Compliance</div>
    </div>

    <div class="summary-grid">
      <div class="stat-box">
        <div id="violCount" class="stat-number" style="color: var(--danger);">0</div>
        <div class="stat-label">Violations</div>
      </div>
      <div class="stat-box">
        <div id="passCount" class="stat-number" style="color: var(--success);">0</div>
        <div class="stat-label">Passes</div>
      </div>
      <div class="stat-box">
        <div id="incCount" class="stat-number" style="color: var(--warning);">0</div>
        <div class="stat-label">Incomplete</div>
      </div>
    </div>

    <a id="detailedReportLink" class="report-link hidden" target="_blank" rel="noopener noreferrer">View Detailed Report →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
